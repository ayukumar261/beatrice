services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      POSTGRES_DB: platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: platform
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      POSTGRES_SEEDS: postgresql
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "namespace",
          "describe",
          "--address",
          "temporal:7233",
          "--namespace",
          "default",
          "--command-timeout",
          "5s",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s

  gateway:
    build: .
    restart: unless-stopped
    init: true
    command: ["pnpm", "--filter", "gateway", "start"]
    networks:
      - default
      - dokploy-network
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      LINQ_HOST: 0.0.0.0
      LINQ_PORT: "3001"
      LINQ_API_KEY: ${LINQ_API_KEY:?Set LINQ_API_KEY in Dokploy}
      LINQ_WEBHOOK_SECRET: ${LINQ_WEBHOOK_SECRET:?Set LINQ_WEBHOOK_SECRET in Dokploy}
      LINQ_PHONE_NUMBER: ${LINQ_PHONE_NUMBER:?Set LINQ_PHONE_NUMBER in Dokploy}
      LINQ_ALLOWED_NUMBERS: ${LINQ_ALLOWED_NUMBERS:?Set LINQ_ALLOWED_NUMBERS in Dokploy}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    command: ["pnpm", "--filter", "worker", "start"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      LINQ_API_KEY: ${LINQ_API_KEY:?Set LINQ_API_KEY in Dokploy}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in Dokploy}
      BRAINTRUST_API_KEY: ${BRAINTRUST_API_KEY:?Set BRAINTRUST_API_KEY in Dokploy}
      BRAINTRUST_PROJECT: ${BRAINTRUST_PROJECT:-platform}

  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "--config",
        "/etc/cloudflared/config.yml",
        "run",
      ]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      TUNNEL_CRED_CONTENTS: ${TUNNEL_CRED_CONTENTS:?Set tunnel credentials in Dokploy}
    configs:
      - source: cloudflared-config
        target: /etc/cloudflared/config.yml

configs:
  cloudflared-config:
    content: |
      tunnel: a15e8ecc-f7ef-4414-b78a-2bc2d91e33a5
      ingress:
        - hostname: linq.ayukumar261.com
          path: ^/(webhooks/linq|healthz)$$
          service: http://gateway:3001
        - service: http_status:404

networks:
  default:
  dokploy-network:
    external: true

volumes:
  postgres-data:
