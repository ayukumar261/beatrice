name: beatrice

services:
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Run pnpm garage:setup first}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:?Run pnpm garage:setup first}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:?Run pnpm garage:setup first}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-beatrice-media}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test:
        ["CMD", "/garage", "bucket", "info", "${GARAGE_BUCKET:-beatrice-media}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - temporal

  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    environment:
      POSTGRES_USER: beatrice
      POSTGRES_PASSWORD: beatrice
      POSTGRES_DB: beatrice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beatrice -d beatrice"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.1}
    container_name: temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=beatrice
      - POSTGRES_PWD=beatrice
      - POSTGRES_SEEDS=postgresql
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "namespace",
          "describe",
          "--address",
          "temporal:7233",
          "--namespace",
          "default",
          "--command-timeout",
          "5s",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    ports:
      - "7233:7233"
    networks:
      - temporal

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-latest}
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - temporal

  gateway:
    build: .
    init: true
    working_dir: /app/apps/gateway
    command:
      [
        "pnpm",
        "exec",
        "tsx",
        "watch",
        "--include",
        "src/**/*.ts",
        "--include",
        "../../packages/types/src/**/*.ts",
        "src/index.ts",
      ]
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      TEMPORAL_ADDRESS: temporal:7233
      LINQ_HOST: 0.0.0.0
      LINQ_PORT: "3001"
    ports:
      - "127.0.0.1:${LINQ_PORT:-3001}:3001"
    volumes:
      - ./apps/gateway/src:/app/apps/gateway/src:ro
      - ./packages/types/src:/app/packages/types/src:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - temporal

  worker:
    build: .
    init: true
    stop_grace_period: 2m
    working_dir: /app/apps/worker
    command:
      [
        "pnpm",
        "exec",
        "tsx",
        "watch",
        "--include",
        "src/**/*.ts",
        "--include",
        "../../packages/types/src/**/*.ts",
        "src/worker.ts",
      ]
    depends_on:
      garage:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: .env.braintrust
        required: false
      - path: apps/worker/.env
        required: false
    environment:
      NODE_ENV: development
      TEMPORAL_ADDRESS: temporal:7233
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_BUCKET: ${GARAGE_BUCKET:-beatrice-media}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?Run pnpm garage:setup first}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?Run pnpm garage:setup first}
    volumes:
      - ./apps/worker/src:/app/apps/worker/src:ro
      - ./packages/types/src:/app/packages/types/src:ro
    networks:
      - temporal

volumes:
  garage-meta:
  garage-data:
  postgres-data:

networks:
  temporal:
    driver: bridge
